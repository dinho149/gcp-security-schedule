# Copy to config/config.local.yaml and fill in. The .local file is gitignored.
#   cp config/config.example.yaml config/config.local.yaml

slack:
  # Channel that carries digest, quiz, results and feedback.
  channel_id: "C0XXXXXXXXX"
  channel_name: "#gcp-security-exam"
  # The learner's Slack user id. Grading counts only THIS user's reactions.
  # There is no bot and nothing is pre-seeded: the connector posts AS this
  # account, so anything it reacted with would be indistinguishable from a real
  # answer. See docs/decisions.md. The filter is defence in depth against other
  # members of a public channel.
  user_id: "U0XXXXXXXXX"
  # Workspace subdomain -- the <name> in https://<name>.slack.com. Used only to
  # build message permalinks, so a digest can link the question it is
  # remediating instead of saying "Q8" and leaving you to scroll back a day.
  # Personal, so the real value lives in config.local.yaml.
  workspace: "your-workspace"

notion:
  # Root page whose children are courses.
  root_page_id: "00000000000000000000000000000000"
  # Databases the system writes to. Leave blank on first run; sync-notion
  # creates them and writes the ids back.
  quiz_results_db: ""
  daily_digests_db: ""

github:
  repo: "owner/repo"
  # A PR may auto-merge only if it satisfies every condition in
  # docs/feedback-sdlc.md. Set false to always require human review.
  auto_merge_trivial: true

dashboard:
  # Stable artifact URL for the readiness dashboard, republished by
  # exam-readiness. Blank until the first publish, which writes the URL back
  # here — after that it is the same bookmarkable page every time.
  url: ""

render:
  # Headless Chrome renders digest visuals. This is a HINT, not a requirement:
  # dashboard/ensure_chrome.py falls through it when it does not exist, then
  # searches PATH, then the places a browser hides when it is not on PATH, then
  # downloads one. So the macOS default below is simply ignored on Linux rather
  # than needing to be overwritten for the sandbox.
  chrome_path: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"

  # Download chrome-headless-shell (~100 MB) when nothing is installed. Defaults
  # to on everywhere but macOS, where a laptop already has Chrome. Set false to
  # keep a sandbox that has already proved barren from re-paying every morning --
  # though control.render_probe does that automatically, with a 7-day expiry.
  install: true
