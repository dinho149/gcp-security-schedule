# Timing. THIS is the file you edit to retune the day — never a scheduler UI.
#
# The scheduled task just ticks. Each tick asks this file what is due, so a
# change here takes effect on the next tick with no other action.
# Slack shortcut: post `!schedule quiz 17:00` and the agent edits this for you.

timezone: Europe/London
days: [mon, tue, wed, thu, fri]

digest_at: "07:15"
quiz_at:   "12:30"
grade_at:  "20:45"

# A tick landing within this many minutes after a step's time still fires it,
# so a missed tick doesn't skip the day.
grace_minutes: 60

# How often the scheduled task runs. Straight trade: lower = on-demand Slack
# commands land sooner; higher = fewer wake-ups. For instant, use a session
# instead of a Slack command.
tick_minutes: 15

on_demand:
  # Ad-hoc practice still moves mastery scores and spaced-repetition due dates.
  counts_toward_mastery: true
  # An on-demand digest when one already went out picks the NEXT weakest topics
  # rather than repeating the day's.
  digest_advances_topics: true

quiz:
  questions: 10
  # Composition of a standard set. Must sum to `questions`.
  mix:
    new: 6
    review_due: 3
    previously_wrong: 1
  # Scenario depth per set, matching the measured official-sample distribution.
  # See reference/question-spec.md §7.
  depth:
    bare: 1
    mid: 6
    deep: 3
